<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastPort · 追加 Marble 3D</title><link rel="stylesheet" href="/static/studio.css"><main><h1>将已有匹配接入 Marble 3D</h1><p><a href="/">返回原 PDF + 全景流程</a></p><p>编号、证据、介绍和人工修改从已有匹配结果保留。上传已生成的 Marble world.json；此入口不调用 Marble 生成，不消耗新的生成积分。三维点位须对齐和人工确认后才展示。</p><form id="attach"><label>已完成的匹配结果<select id="job" required></select></label><label>对应的原全景视点<select id="scene" required></select></label><label>方式<select id="mode"><option value="existing">导入已生成的 Marble 结果（不产生新生成费用）</option><option value="generate">从此匹配结果的干净全景生成（需本机密钥和单次授权）</option></select></label><div id="existing"><label>Marble world.json<input id="world" type="file" accept=".json"></label></div><div id="generation" hidden><label>模型<select id="model"><option value="marble-1.1">Marble 1.1（全景预计1500 credits）</option><option value="marble-1.0-draft">Draft（全景预计150 credits）</option></select></label><label>本次 credit 预算<input id="credit-budget" type="number" min="150" max="100000" value="1500"></label><label><input id="authorize-marble" type="checkbox">允许一次 Marble 生成，使用本机环境变量中的密钥。预算按已知价格准入，不是服务端硬上限；以实际结算为准。</label><p>密钥不在网页输入或保存。等待任务只查询原任务，不重复生成。物件保留提示不能保证生成完全不变。</p></div><p>当前网页接收含 Marble CDN 资产链接的 world.json；完整本地导出目录可用 CLI。必须对应同一场景，技术样例不能冒充业务匹配验收。</p><button id="submit">接入 3D 并保留匹配</button></form><p id="status" role="status"></p><section id="previous"><h2>已保存的 3D 结果</h2></section><script src="/static/scene3d.js"></script></main></html>
