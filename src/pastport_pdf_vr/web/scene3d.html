<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastPort · 生成 3D</title><link rel="stylesheet" href="/static/studio.css"><style>.key-card{max-width:620px;padding:28px;margin:30px auto}.key-card h2{line-height:1.5}.key-card label{display:block;margin:24px 0 12px}.key-card button{margin-top:16px}.key-card a{color:#315b37}.key-card #status{white-space:pre-wrap;line-height:1.7}</style><main><p><a href="/">← 返回工作台</a></p><form id="generate-3d" class="results key-card"><h1>生成 3D</h1><h2 id="source-title">正在读取对应的 VR 记录…</h2><p class="hint">保留已有编号、介绍和后台链接，从此 VR 的起始全景生成一个可移动的 3D 场景。</p><label for="api-key">Marble API Key</label><input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="输入 API Key"><p class="hint" id="key-state">密钥仅保留在本次服务内存中，不写入文件。</p><p class="hint">点击生成即授权一次 Marble 生成，预计消耗 1,500 credits，以实际结算为准。保存密钥或查询任务不会重复生成。</p><button id="submit" type="submit" disabled>生成 3D</button><p id="status" role="status" aria-live="polite"></p></form><details class="results key-card"><summary>导入已有 3D（无需重新生成）</summary><form id="import-3d"><p class="hint">沿用当前 VR 的编号和介绍。选择已有 Marble 导出记录（.json），不消耗新的生成积分，也不需要 API Key。</p><input id="existing-world" type="file" accept=".json" required><button id="import-submit" type="submit">导入已有 3D</button><p id="import-status" role="status"></p></form></details><section class="results"><div class="form-heading"><h2>3D 生成记录</h2></div><div id="scene3d-jobs"></div></section></main><script src="/static/scene3d.js"></script><script src="/static/scene3d_records.js"></script></html>
