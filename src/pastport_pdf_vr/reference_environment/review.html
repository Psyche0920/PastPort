<!doctype html><html lang="zh"><meta charset="utf-8"><title>PastPort 图文配对复核数据库</title>
<style>body{margin:0;font:15px system-ui;background:#f4f2ed;color:#202923}header{background:#183b34;color:white;padding:22px}main{display:grid;grid-template-columns:260px 1fr;gap:20px;padding:20px}nav{height:86vh;overflow:auto}button,select,input,textarea{font:inherit;padding:8px;border:1px solid #aaa;border-radius:6px}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:white}nav button.active{background:#cbe5d9}section,.panel{background:white;padding:18px;border-radius:10px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}img{max-width:100%;max-height:420px;object-fit:contain;background:#eee}.views{display:flex;gap:10px;flex-wrap:wrap}.view{width:150px}.view img{height:130px;width:150px}.warn{background:#fff1d4;padding:12px;border-left:4px solid #c98912}.sub{color:#647269;font-size:13px}pre{white-space:pre-wrap;font:inherit;line-height:1.6}textarea{display:block;width:95%;height:75px}label{display:block;margin:10px 0}a{color:#176359}h2,h3{margin-top:5px}mark{background:#fde6a6}@media(max-width:800px){main,.grid{display:block}nav{height:190px}}</style>
<header><h2>PastPort · 图文配对复核</h2><div>叙事优先的合成演示：代理可以跨类别，但编号稳定、来源真实。图片关联与文字适用性分别复核。</div></header>
<main><nav><input id="search" placeholder="对象编号或名称"><select id="filter"><option value="">全部对象</option><option value="unmatched">尚未配对</option><option value="pending">图片尚未复核</option></select><div id="list"></div></nav><article id="detail">载入数据库…</article></main>
<script>
let data,current=Number(new URLSearchParams(location.search).get('object_id'))||1;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=(path,alt)=>`<a href="${esc(path)}" target="_blank"><img src="${esc(path)}" alt="${esc(alt)}"></a>`;
async function load(){const r=await fetch('/api/data');if(!r.ok)throw Error('读取失败');data=await r.json();renderList();show(current)}
function renderList(){const q=$('search').value.toLowerCase(),f=$('filter').value;$('list').innerHTML=data.objects.filter(o=>(`${o.id} ${o.name}`).toLowerCase().includes(q)&&(!f||(f==='unmatched'&&!o.historical_id)||(f==='pending'&&o.image_review==='unreviewed'))).map(o=>`<button class="${o.id===current?'active':''}" data-id="${o.id}">${String(o.id).padStart(2,'0')} · ${esc(o.name)}<div class="sub">${esc(o.historical_id||'未分配来源')} · ${esc(o.proposal_state)}</div></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(Number(b.dataset.id)))}
function show(id){if(!data.objects.some(x=>x.id===id))id=1;current=id;const o=data.objects.find(x=>x.id===id),s=data.sources.find(x=>x.id===o.historical_id),views=data.observations.filter(x=>x.object_id===id),reviews=data.reviews.filter(x=>x.modern_id===id),last=reviews.at(-1),vr=(data.vr_contents||[]).find(x=>x.object_id===id);renderList();
$('detail').innerHTML=`<section><h2>${String(id).padStart(2,'0')} · ${esc(o.name)}</h2><p>${esc(o.note)}</p><p class="sub">类别：${esc(o.category)}；父对象：${esc(o.parent_id||'无')}；出现 ${views.length} 次。坐标为左上原点的归一化选区。</p><div class="warn">${esc(o.rationale)}</div></section><div class="grid"><section><h3>你的照片：同一对象的全部视角</h3><div class="views">${views.map(v=>`<div class="view">${img(`media/observation-${String(v.id).padStart(3,'0')}.jpg`,'对象选区')}<p>照片 ${String(v.photo_id).padStart(2,'0')} · 对象 ${String(id).padStart(2,'0')}</p><div class="sub">${v.identity_state==='identity_pending'?'身份待确认':'已记录出现'} · ${v.identity_basis==='user_confirmed'?'用户确认同一身份':'人工识别'}</div><a href="media/photo-${String(v.photo_id).padStart(2,'0')}.jpg" target="_blank">查看完整照片</a><details><summary>位置坐标</summary>${[v.x0,v.y0,v.x1,v.y1].join(', ')}<p>${esc(v.note)}</p></details></div>`).join('')}</div></section><section><h3>PDF 来源对象${s?' · '+esc(s.id):''}</h3>${s?`<h3>${esc(s.title_zh)}</h3><p>${esc(s.title_en)}</p><p class="warn">${s.image_role==="text_evidence"?"这是原文证据截图，没有已确认的实物照片。":s.image_role==="building_context"?"这是所属区域环境参照，不是该部件的内部特写。":"原PDF中的对象选区。"}</p>${img(s.media_path,s.title_zh)}<p>来源截图：PDF 第 ${s.image_page} 页／印刷页 ${s.image_page+109}；建筑 ${esc(s.building_id)}；父对象 ${esc(s.parent_ref)}</p><a href="media/source-page-${String(s.image_page).padStart(2,'0')}.png" target="_blank">查看完整来源图片页</a><p class="sub">选区：${esc(s.image_box)}。同页照片与段落不自动视为对应。</p>`:'<p>未找到合适来源，保留空值。</p>'}</section></div>${s?`<section><h3>英文原文与适用范围</h3>${s.recommended_display_zh?`<div class="panel"><h4>助手核对后的建议说明</h4><p>${esc(s.recommended_display_zh)}</p><p class="warn">${esc(s.audit_limitation)}</p><p class="sub">编辑判断：${esc(s.audit_verdict)}。这是中文改述，原文保留在下方；不是用户批准。</p></div>`:""}<div class="warn">范围：${esc(s.text_scope)}<p>${esc(s.scope_warning)}</p></div>${s.exact_text?`<h4>所选原文片段</h4><pre>${esc(s.exact_text)}</pre><h4>中文译文（人工整理，未独立审校）</h4><pre>${esc(s.translation_zh)}</pre><p>文字：PDF 第 ${s.text_page} 页／印刷页 ${s.text_page+109}。下方展开文字页上下文，图片页可能不同。</p><details><summary>展开完整文字页上下文及精确支持位置</summary><p class="sub">位置 ${s.start_offset}–${s.end_offset}：规范化页面的 Unicode 字符偏移，非 PDF 字节或屏幕坐标。</p><pre>${esc(s.page_context.slice(0,s.start_offset))}<mark>${esc(s.exact_text)}</mark>${esc(s.page_context.slice(s.end_offset))}</pre></details>`:'<p>仅有图像证据，没有可引用的独立英文介绍。</p>'}</section>`:''}<section><h3>VR中显示的内容</h3>${vr?`<p class="sub">VR编号 ${String(id).padStart(2,'0')} · 显示文字版本 ${vr.version} · ${esc(vr.editor)} · ${esc(vr.updated_at)}</p>${!vr.mapping_current?'<p class="warn">历史映射已经变化，请先核对内容与新来源；当前禁止直接覆盖。</p>':''}<p class="warn">当前显示：${vr.display_source==='human_override'?'人工修改版本（优先）':'AI草稿（尚未人工修改，默认展示）'}。修改保存后优先使用人工版本，不会改动原文证据。</p><details><summary>查看AI初始草稿</summary><pre>${esc(vr.ai_draft)}</pre></details><h4>当前已保存的弹窗内容</h4><pre id="vr-preview">${esc(vr.content)}</pre><label for="vr-content">修改VR弹窗文字（最多1500字）</label><textarea id="vr-content" maxlength="1500" style="height:210px">${esc(vr.content)}</textarea><label>编辑者 <input id="vr-editor" placeholder="填写姓名或代号" value="${esc(vr.editor==='initial_trial_snapshot'?'':vr.editor)}"></label><p><button id="vr-save" ${!vr.mapping_current?'disabled':''}>保存VR显示内容</button> <span id="vr-result" role="status"></span></p><p class="sub">保存后，VR下一次点击此编号会读取最新文字；已打开弹窗请关闭后重新点开。该操作不改原始英文证据，不代表自动通过历史审核。离线下载版保留导出时快照。</p><a href="/vr_trial/index.html" target="_blank">打开VR查看</a>`:'<p>此对象当前没有放置VR热点，因此还没有弹窗内容。05号背包尚未定位；其他未纳入本轮的对象保持原状。</p>'}</section><section><h3>人工复核 · 两个结论分别保存</h3><p class="sub">保存只记录你的评价，不会替你改配对。历史评价保留；不能用图片合适代替文字合适。</p><label>图片／对象对应 <select id="image"><option value="unreviewed">未复核</option><option value="suitable">适合</option><option value="unsuitable">不适合</option><option value="uncertain">待确认</option></select></label><label>文字对所选对象的适用性 <select id="text"><option value="unreviewed">未复核</option><option value="direct">直接适用</option><option value="context_only">只能作背景</option><option value="unsuitable">不适用</option><option value="uncertain">待确认</option></select></label><label>复核人 <input id="reviewer" placeholder="填写姓名或代号" value="${esc(last?.reviewer||'')}"></label><textarea id="note" placeholder="例如：图是门，但这句讲的是门上的铭文。">${esc(last?.note||'')}</textarea><p><button id="save">保存到 SQLite 数据库</button> <span id="result"></span></p><details><summary>历史评价（${reviews.length} 次）</summary>${reviews.map(r=>`<p>${esc(r.created_at)} · ${esc(r.reviewer)}：图片 ${esc(r.image_verdict)}／文字 ${esc(r.text_verdict)}<br>${esc(r.note)}</p>`).join('')}</details></section><section><h3>VR挂载试验</h3><p><a href="/vr_trial/index.html" target="_blank">打开完整VR成品 Demo</a></p><p>当前独立重匹配提案：37个对象、66处热点；编号点击显示文字，人工拖拽后自动保存。05号背包及36号运动鞋未放置；身份疑点以VR页面说明为准。</p></section><section><h3>新版PDF与数据</h3><p><a href="/mapping-demo.pdf" target="_blank">打开映射PDF Demo</a> · <a href="/demo.html">三个Demo入口</a></p><p><a href="/expanded_mapping.csv">下载当前39项映射表</a> · <a href="/expanded_dataset.json">下载扩展数据</a></p><p>已撤下扶手椅→学生房，新增电脑→书册、鼠标→放碗凹槽；目前27项分配来源、12项留空。包含3项既有待确认候选。5项新设施只有文字证据，不能视为已拍到的实物。</p></section><section><h3>参考方法</h3>${data.references.map(r=>`<p><a href="${esc(r.url)}" target="_blank">${esc(r.title)}</a> — ${esc(r.basis)}</p>`).join('')}<p><a href="pastport_matching.sqlite3">下载当前数据库</a> · <a href="README.md">字段与使用说明</a></p></section>`;
if(vr){$('vr-save').onclick=async()=>{const button=$('vr-save');button.disabled=true;$('vr-result').textContent='正在保存…';try{const response=await fetch('/api/vr-content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({object_id:id,version:vr.version,content:$('vr-content').value,editor:$('vr-editor').value})});if(!response.ok)throw Error(response.status===409?'版本或历史映射已变化，请刷新后核对；本次未保存。':'保存失败，请填写编辑者，确认文字为1–1500字。');await load();$('vr-result').textContent='已保存。回到VR关闭弹窗，再点击编号即可看到更新。'}catch(error){$('vr-result').textContent=error.message;button.disabled=false}}}
$('image').value=o.image_review;$('text').value=o.text_review;$('save').onclick=async()=>{const btn=$('save');btn.disabled=true;try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({object_id:id,version:o.version,image:$('image').value,text:$('text').value,note:$('note').value,reviewer:$('reviewer').value})});if(!r.ok)throw Error(r.status===409?'数据已被另一页面更新，请刷新后复核':'保存失败，请检查复核人和输入');await load();$('result').textContent='已保存'}catch(e){$('result').textContent=e.message;btn.disabled=false}}}
$('search').oninput=renderList;$('filter').onchange=renderList;load().catch(e=>$('detail').textContent=e.message);
</script></html>
