<aside><b>PastPort · Marble 3D</b><p><a href="/api/scene3d-export">下载开发文件包</a> · <a href="/">审核后台</a> · <a href="/vr_trial/index.html">原始匹配全景</a></p><p class="small">拖动画面转向；WASD 前后左右，Q/E 上下，Shift 加速。靠近透明箭头会自动切换到下一点位，进入方向沿用VR设置；也可点击箭头切换。自由浏览可能穿墙。橙色虚线编号为自动迁移候选，位置待核对；绿色编号为已保存的人工位置。</p><p id="notice">加载已有场景…</p>
<details><summary>1. 对齐原全景拍摄点</summary><p class="small">先确认当前 3D 与原全景属于同一场景。初值只是猜测，不是已知相机位姿。移动到拍摄点，校准朝向后保存。</p><img id="source" src="panorama.jpg" alt="已匹配的原始全景，用于相机对齐"><label>位置 X/Y/Z<br><input id="ox" type="number" step="0.1" value="0"><input id="oy" type="number" step="0.1" value="1.6"><input id="oz" type="number" step="0.1" value="0"></label><button id="capture">取当前相机位置与朝向</button><label>朝向 / 俯仰 / 滚转（度）<br><input id="yaw" type="number" step="1" value="0"><input id="pitch" type="number" step="1" value="0"><input id="roll" type="number" step="1" value="0"></label><label><input id="aligned" type="checkbox">已人工确认来源场景与拍摄位姿对应</label><textarea id="alignment-basis" placeholder="记录共同可见特征及对齐依据"></textarea><button id="save-alignment">保存对齐</button><button id="origin">回到对齐拍摄点</button></details>
