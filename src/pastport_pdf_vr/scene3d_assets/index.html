<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastPort · 3D 导览</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#18201c;color:#edf1e9;font:14px system-ui}canvas{display:block}button,input,select,textarea{font:inherit;box-sizing:border-box}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button,a{touch-action:manipulation}button{border:1px solid #ffffff40;background:#163d35d9;color:#fff;border-radius:9px;padding:10px 14px}button:hover{background:#285347}a{color:#d2e5bb}.tour-header{position:fixed;top:24px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;text-shadow:0 1px 6px #000}.tour-header button{pointer-events:auto}.brand{letter-spacing:.24em;font-size:11px}.tour-header h1{font-size:22px;margin:8px 0}.tour-actions{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:10px;white-space:nowrap}.tour-hint{position:fixed;bottom:86px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 1px 6px #000;pointer-events:none;font-size:12px}.toast{position:fixed;bottom:134px;left:50%;transform:translateX(-50%);max-width:80vw;background:#163d35ed;border-radius:9px;padding:10px 16px}aside{position:fixed;top:16px;right:16px;bottom:110px;width:340px;max-width:calc(100vw - 32px);overflow:auto;background:#16372bf2;padding:18px;border-radius:12px;box-sizing:border-box}aside[hidden]{display:none}aside h2{font-size:18px;display:inline}aside #close-editor{float:right}aside label{display:block;margin:12px 0}aside input[type=number]{width:80px;padding:7px}aside textarea,aside select{width:100%;padding:8px;margin:5px 0}aside p{line-height:1.6}aside details{margin:16px 0}#notice{font-size:12px;color:#ffdc9d;white-space:pre-wrap}#source{width:100%}.small{font-size:12px;color:#b6c8b6}#popup{position:fixed;right:16px;bottom:110px;max-width:360px;max-height:65vh;overflow:auto;background:#16372bf2;padding:20px;border-radius:12px;white-space:pre-wrap;display:none}#popup button{margin:8px}#popup a{display:block}@media(max-width:600px){.tour-header{top:16px;left:16px;right:16px}.tour-header h1{font-size:18px}.tour-actions{bottom:18px;gap:6px}.tour-actions button{padding:10px}.tour-hint{bottom:74px}#popup{left:16px;max-width:none}}

<header class="tour-header"><div><div class="brand">PASTPORT · 3D TOUR</div><h1>三维场景导览</h1></div><button id="fullscreen" type="button">⛶ 全屏</button></header>
<div id="walk-hint" class="tour-hint">拖动画面转向 · WASD 移动 · 越过箭头分界切换点位</div><div id="toast" class="toast" role="status" hidden></div>
<nav class="tour-actions" aria-label="导览操作"><button id="home-view" type="button">回到起始视角</button><button id="next-viewpoint" type="button" disabled>切换点位 →</button><button id="edit-panel" type="button">编辑</button></nav>
<aside id="editor-panel" hidden><h2>编辑场景</h2><button id="close-editor" type="button">关闭</button><p class="small">修改介绍请点击编号进入审核后台。位置调整只影响当前3D。</p>
<label><input id="drag-arrows" type="checkbox">调整导航箭头</label><button id="retry-arrow" hidden>重试箭头保存</button>
<label><input id="drag-markers" type="checkbox">调整编号位置</label><button id="retry-position" hidden>重试位置保存</button>
<details><summary>高级校准</summary><p class="small">仅在自动位置不正确时使用；这些操作不会替代物件身份审核。</p><details><summary>对齐原全景拍摄点</summary><img id="source" src="panorama.jpg" alt="原始全景对照"><label>位置 X/Y/Z<br><input id="ox" type="number" step="0.1" value="0"><input id="oy" type="number" step="0.1" value="1.6"><input id="oz" type="number" step="0.1" value="0"></label><button id="capture">取当前相机位置与朝向</button><label>朝向 / 俯仰 / 滚转（度）<br><input id="yaw" type="number" step="1" value="0"><input id="pitch" type="number" step="1" value="0"><input id="roll" type="number" step="1" value="0"></label><label><input id="aligned" type="checkbox">已确认来源场景与拍摄位姿</label><textarea id="alignment-basis" placeholder="对齐依据"></textarea><button id="save-alignment">保存对齐</button><button id="origin">回到对齐拍摄点</button></details>
<details><summary>编号定位校准</summary><select id="object"></select><button id="propose">沿原热点方向计算候选点</button><label><input id="pick" type="checkbox">点选表面修正位置</label><p id="coordinates"></p><input id="editor" placeholder="编辑者"><textarea id="basis" placeholder="物件身份核对依据"></textarea><textarea id="relation" placeholder="部件从属关系依据"></textarea><button id="confirm">确认并显示编号</button><button id="remove">撤下此编号</button></details><p id="notice">载入场景…</p></details>
