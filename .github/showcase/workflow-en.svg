<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PastPort production workflow">
<title>PastPort production workflow</title>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#55e6dc" stroke-opacity=".07"/></pattern><linearGradient id="bg"><stop stop-color="#080e1e"/><stop offset="1" stop-color="#121c30"/></linearGradient></defs>
<rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect width="1200" height="300" rx="24" fill="url(#grid)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="36" y="48" font-size="16" letter-spacing="1" fill="#55e6dc">FROM SOURCES TO A PLAYABLE FIRST VERSION</text><rect x="36" y="88" width="270" height="130" rx="14" fill="#142238" stroke="#2a465a"/><text x="54" y="120" font-size="13" fill="#55e6dc">01</text><text x="54" y="156" font-size="20" font-weight="700" fill="#edf3ff">Historical sources</text><text x="54" y="187" font-size="12" fill="#b3c2d9">PDF / IDML + linked images</text><path d="M309 153h10m-4-4 4 4-4 4" fill="none" stroke="#55e6dc" stroke-width="2"/><rect x="322" y="88" width="270" height="130" rx="14" fill="#142238" stroke="#2a465a"/><text x="340" y="120" font-size="13" fill="#55e6dc">02</text><text x="340" y="156" font-size="20" font-weight="700" fill="#edf3ff">Environment matching</text><text x="340" y="187" font-size="12" fill="#b3c2d9">Visual evidence + 3D location</text><path d="M595 153h10m-4-4 4 4-4 4" fill="none" stroke="#55e6dc" stroke-width="2"/><rect x="608" y="88" width="270" height="130" rx="14" fill="#142238" stroke="#2a465a"/><text x="626" y="120" font-size="13" fill="#55e6dc">03</text><text x="626" y="156" font-size="20" font-weight="700" fill="#edf3ff">Story &amp; gameplay</text><text x="626" y="187" font-size="12" fill="#b3c2d9">Editable drafts + components</text><path d="M881 153h10m-4-4 4 4-4 4" fill="none" stroke="#55e6dc" stroke-width="2"/><rect x="894" y="88" width="270" height="130" rx="14" fill="#142238" stroke="#2a465a"/><text x="912" y="120" font-size="13" fill="#55e6dc">04</text><text x="912" y="156" font-size="20" font-weight="700" fill="#edf3ff">Review &amp; release</text><text x="912" y="187" font-size="12" fill="#b3c2d9">Human approval + versioned package</text><text x="36" y="268" font-size="15" fill="#b3c2d9">AI assists production. Schemas check structure. People review historical accuracy and approve release.</text></g></svg>