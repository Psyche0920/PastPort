name: PastPort CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: 'Intentionally fail quality to verify that the ci gate rejects failures'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Check repository specifications and handoff documentation
        run: |
          python3 tools/check_repository.py
          python3 tools/check_handoff.py
      - name: Install locked contract tooling
        id: tooling
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --all-packages --all-extras --group dev
      - name: Lint Python sources and tests
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: uv run --no-sync ruff check .
      - name: Check Python formatting
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: uv run --no-sync ruff format --check .
      - name: Check strict application and test types
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        env:
          MYPYPATH: src:tests
        run: >-
          uv run --no-sync mypy --strict --explicit-package-bases
          src/pastport tools/check_contracts.py tools/check_handoff.py
          tools/check_repository.py tests
      - name: Check generated schemas and fixtures
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: uv run --no-sync python tools/check_contracts.py
      - name: Check shared player contracts
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: uv run --no-sync python -m pastport.development.player_contracts --check
      - name: Failure propagation probe (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe }}
        run: |
          python - <<'PY'
          import unittest
          unittest.TestCase().fail("Intentional CI failure probe; no product code was changed.")
          PY

  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Install locked application and SDK test tooling
        id: tooling
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --all-packages --all-extras --group dev
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Run offline contracts and shared player components
        run: uv run --no-sync python -m pytest --junitxml=acceptance-artifacts/python-tests.xml
      - name: Run F9 offline module acceptance kit
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: >-
          uv run --no-sync python -m pastport.development.module_acceptance
          --evidence-version bundled-f9-1 --narrative-version bundled-f9-1
          --resource-version bundled-local-1
          --output acceptance-artifacts/offline.json
      - name: Run F9 approval budget and crash fault gates
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: >-
          uv run --no-sync python -m pastport.development.fault_acceptance
          --output acceptance-artifacts/faults.json

  sdk-tests:
    name: sdk-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Install locked SDK tooling and offline rendering tools
        id: tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          python -m pip install uv==0.12.8
          uv sync --locked --all-packages --all-extras --group dev
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Check strict types for all five SDKs
        run: >-
          uv run --no-sync mypy --strict --follow-imports=silent
          packages/evidence-sdk/src/pastport_evidence
          packages/matched-environment-sdk/src/pastport_matched_environment
          packages/stylization-sdk/src/pastport_stylization
          packages/story-sdk/src/pastport_story
          packages/gameplay-sdk/src/pastport_gameplay
          packages/stylization-sdk/tests
          packages/matched-environment-sdk/tests/test_appearance.py
      - name: Build all workspace distributions
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        run: uv build --all-packages --out-dir acceptance-artifacts/wheels
      - name: Run Evidence SDK offline regressions
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        working-directory: packages/evidence-sdk
        run: uv run --no-sync python -m unittest discover -s tests -t . -v
      - name: Run Matched Environment SDK offline regressions
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        working-directory: packages/matched-environment-sdk
        run: uv run --no-sync python -m unittest discover -s tests -t . -v
      - name: Run Stylization SDK offline regressions
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        working-directory: packages/stylization-sdk
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

  browser-tests:
    name: browser-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26.10.0'
          package-manager-cache: false
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --group dev
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check native frontend and real browser workflow
        run: |
          npm run check:js
          npm run format:check
          uv run --no-sync python -m pastport.development.browser_check

  ci:
    name: ci
    if: ${{ always() }}
    needs: [quality, python-tests, sdk-tests, browser-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["CHECK_RESULTS"])
          failed = [name for name, result in results.items() if result["result"] != "success"]
          if failed:
              print("Required checks did not succeed: " + ", ".join(failed))
              sys.exit(1)
          print("All required checks passed.")
          PY
