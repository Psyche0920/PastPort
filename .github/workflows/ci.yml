name: PastPort CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: 'Intentionally fail quality to verify that the ci gate rejects failures'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Check repository specifications and syntax
        run: python3 tools/check_repository.py
      - name: Install locked contract tooling
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --group dev
      - name: Check contract quality and generated schemas
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy --strict src/pastport tools/check_contracts.py tests
          uv run --no-sync python tools/check_contracts.py
      - name: Failure propagation probe (manual opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe }}
        run: |
          python - <<'PY'
          import unittest
          unittest.TestCase().fail("Intentional CI failure probe; no product code was changed.")
          PY

  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: '.python-version'
      - name: Install locked contract tooling
        run: |
          python -m pip install uv==0.12.8
          uv sync --locked --group dev
      - name: Run offline contract tests
        run: uv run --no-sync pytest

  ci:
    name: ci
    if: ${{ always() }}
    needs: [quality, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["CHECK_RESULTS"])
          failed = [name for name, result in results.items() if result["result"] != "success"]
          if failed:
              print("Required checks did not succeed: " + ", ".join(failed))
              sys.exit(1)
          print("All required checks passed.")
          PY
