[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pastport-evidence"
version = "0.1.0"
description = "Photo and historical PDF to evidence-grounded comparison PDF and editable IDML"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "langgraph>=1.2,<2", "pdfplumber>=0.11,<1", "pypdf>=5,<7", "pillow>=10.4,<13", "reportlab>=4,<5"]

[project.optional-dependencies]
codex = ["openai-codex==0.163.0"]
dev = ["mypy>=1.18,<2", "ruff>=0.14,<1", "types-reportlab>=5.0.0.20261008"]

[project.scripts]
pastport-evidence = "pastport_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pastport_evidence = ["prompts/*.txt", "fonts/*.ttf", "fonts/*.txt"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pastport_evidence"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
