[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pastport"
version = "0.1.0"
description = "Versioned contracts for evidence-grounded heritage games"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.18.2", "ruff==0.14.1", "jsonschema==4.25.1", "types-jsonschema==4.25.1.20251009"]

[tool.hatch.build.targets.wheel]
packages = ["src/pastport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/check_contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
