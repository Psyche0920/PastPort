[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pastport"
version = "0.2.0"
description = "Typed editorial workflow for evidence-grounded heritage games"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pydantic==2.12.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
authoring = ["pastport-evidence==0.1.0", "pastport-matched-environment==0.1.0", "pastport-stylization==0.1.0"]
authoring-codex = ["pastport-evidence[codex]==0.1.0", "pastport-matched-environment[codex]==0.1.0", "pastport-stylization[codex]==0.1.0"]

[tool.uv.workspace]
members = ["packages/evidence-sdk", "packages/matched-environment-sdk", "packages/stylization-sdk"]

[tool.uv.sources]
pastport-evidence = { workspace = true }
pastport-matched-environment = { workspace = true }
pastport-stylization = { workspace = true }

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "mypy==1.18.2",
    "ruff==0.14.1",
    "jsonschema==4.25.1",
    "types-jsonschema==4.25.1.20251009",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pastport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/check_contracts.py", "tools/check_handoff.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
