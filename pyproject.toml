[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pastport"
version = "0.2.1rc4"
description = "Typed editorial workflow for evidence-grounded heritage games"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pydantic==2.12.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
codex = ["openai-codex==0.163.0"]
game-making = ["pastport-story==0.1.0rc4", "pastport-gameplay==0.1.0rc2"]
authoring = ["pastport-evidence==0.1.0", "pastport-matched-environment==0.1.0", "pastport-stylization==0.1.0"]
authoring-codex = ["pastport-evidence[codex]==0.1.0", "pastport-matched-environment[codex]==0.1.0", "pastport-stylization[codex]==0.1.0"]

[tool.uv.workspace]
members = ["packages/evidence-sdk", "packages/matched-environment-sdk", "packages/stylization-sdk", "packages/story-sdk", "packages/gameplay-sdk"]

[tool.uv.sources]
pastport-story = { workspace = true }
pastport-gameplay = { workspace = true }
pastport-evidence = { workspace = true }
pastport-matched-environment = { workspace = true }
pastport-stylization = { workspace = true }

[project.scripts]
pastport-game-trial = "pastport.game_trial_cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "mypy==1.18.2",
    "ruff==0.14.1",
    "jsonschema==4.25.1",
    "types-jsonschema==4.25.1.20251009",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pastport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/check_contracts.py", "tools/check_handoff.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.sdist]
include = ["/frontend/player/network.mjs", "/frontend/player/remote.mjs", "/frontend/player/organizer-gateway.mjs", "/frontend/player/index.html", "/frontend/player/style.css", "/frontend/player/app.mjs", "/frontend/player/game-display-locale.mjs", "/frontend/player/game-display-locales.json", "/frontend/player/server.mjs", "/frontend/player/sites.json", "/frontend/player/sites.mjs", "/frontend/player/illustrations.mjs", "/frontend/player/cloud-saves.mjs", "/frontend/player/save-sync.mjs", "/frontend/player/game-save-bridge.mjs", "/frontend/player/data-identity.mjs", "/frontend/organizer/i18n.mjs", "/frontend/organizer/review.mjs", "/frontend/organizer/index.html", "/frontend/organizer/app.mjs", "/frontend/organizer/app.css", "/src", "/skills", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/frontend/game/app.mjs", "/frontend/game/app.css", "/frontend/game/index.html", "/frontend/game/dialogue.mjs", "/gameplay/plugins/plugins.mjs", "/gameplay/plugins/coverage.mjs", "/gameplay/plugins/gameplay-catalog.mjs", "/frontend/game/session.mjs", "/gameplay/gameplay.mjs", "/frontend/game/navigation.mjs", "/frontend/game/walkmesh.mjs", "/frontend/game/interaction.mjs", "/frontend/game/cinematic-view.mjs", "/frontend/game/scene3d-view.mjs", "/frontend/game/scene-preparation.mjs", "/frontend/game/slice-continuation.mjs", "/frontend/game/investigation-view.mjs", "/gameplay/plugins/investigation.mjs", "/frontend/game/scene3d-runtime.js", "/frontend/game/scene3d-navigation.mjs", "/frontend/game/scene3d-bridge.mjs", "/tools/game-package/serve3d.mjs", "/tools/game-package/player-completion.mjs", "/gameplay/prepared-game.mjs", "/tools/game-package/story-package.mjs", "/tools/game-package/investigation-blueprint.mjs", "/tools/game-package/generated-story.mjs", "/tools/game-package/build-story-package.mjs", "/tools/game-package/runtime-assets.mjs", "/gameplay/contracts.mjs", "/schemas/draft-result.schema.json", "/tools/gameplay_lifecycle.mjs", "/tools/prepare_presentation.mjs", "/frontend/game/startup-options.mjs", "/frontend/game/room-minimap.mjs", "/gameplay/story-presentation.mjs"]

