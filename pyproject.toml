[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pastport-pdf-vr"
version = "0.1.0"
description = "Standalone PDF-to-VR museum preparation workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "langgraph>=1.2,<2",
    "pdfplumber>=0.11,<1",
    "pypdf>=5,<7",
    "numpy>=1.26,<3",
    "pillow>=10.4,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
]

[project.scripts]
pastport-pdf-vr = "pastport_pdf_vr.cli:main"
pastport-animate = "pastport_pdf_vr.application.animation_cli:main"

[project.optional-dependencies]
dev = [
    "reportlab>=4,<5",
    "mypy>=1.18,<2",
    "ruff>=0.14,<1",
    "httpx>=0.28,<1",
    "types-reportlab>=5.0.0.20261008",
]
codex = ["openai-codex==0.163.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pastport_pdf_vr = ["prompts/*.txt", "web/*", "reference_environment/*", "animation_assets/*"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pastport_pdf_vr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
