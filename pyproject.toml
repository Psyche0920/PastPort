[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pastport"
version = "0.2.1rc4"
description = "Typed editorial workflow for evidence-grounded heritage games"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pydantic==2.12.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
codex = ["openai-codex==0.163.0"]
game-making = ["pastport-story==0.1.0rc4", "pastport-gameplay==0.1.0rc2"]
authoring = ["pastport-evidence==0.1.0", "pastport-matched-environment==0.1.0", "pastport-stylization==0.1.0"]
authoring-codex = ["pastport-evidence[codex]==0.1.0", "pastport-matched-environment[codex]==0.1.0", "pastport-stylization[codex]==0.1.0"]

[tool.uv.workspace]
members = ["packages/evidence-sdk", "packages/matched-environment-sdk", "packages/stylization-sdk", "packages/story-sdk", "packages/gameplay-sdk"]

[tool.uv.sources]
pastport-story = { workspace = true }
pastport-gameplay = { workspace = true }
pastport-evidence = { workspace = true }
pastport-matched-environment = { workspace = true }
pastport-stylization = { workspace = true }

[project.scripts]
pastport-game-trial = "pastport.game_trial_cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "mypy==1.18.2",
    "ruff==0.14.1",
    "jsonschema==4.25.1",
    "types-jsonschema==4.25.1.20251009",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pastport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "tools/check_contracts.py", "tools/check_handoff.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE", "/prototype/story-agent-demo/app.mjs", "/prototype/story-agent-demo/app.css", "/prototype/story-agent-demo/index.html", "/prototype/story-agent-demo/dialogue.mjs", "/prototype/story-agent-demo/plugins.mjs", "/prototype/story-agent-demo/coverage.mjs", "/prototype/story-agent-demo/gameplay-catalog.mjs", "/prototype/story-agent-demo/session.mjs", "/prototype/story-agent-demo/gameplay.mjs", "/prototype/story-agent-demo/navigation.mjs", "/prototype/story-agent-demo/walkmesh.mjs", "/prototype/story-agent-demo/interaction.mjs", "/prototype/story-agent-demo/cinematic-view.mjs", "/prototype/story-agent-demo/scene3d-view.mjs", "/prototype/story-agent-demo/scene3d-runtime.js", "/prototype/story-agent-demo/scene3d-navigation.mjs", "/prototype/story-agent-demo/scene3d-bridge.mjs", "/prototype/story-agent-demo/serve3d.mjs", "/prototype/story-agent-demo/prepared-game.mjs", "/prototype/story-agent-demo/story-package.mjs", "/prototype/story-agent-demo/generated-story.mjs", "/prototype/story-agent-demo/build-story-package.mjs", "/prototype/story-agent-demo/engine", "/schemas/draft-result.schema.json", "/tools/gameplay_lifecycle.mjs", "/tools/prepare_presentation.mjs"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "pastport/bundled_skills"
"prototype/story-agent-demo/app.mjs" = "pastport/runtime_assets/prototype/story-agent-demo/app.mjs"
