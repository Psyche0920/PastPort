<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PastPort · Bursa Heritage Map</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body>
<header>
  <div class="header-spacer" aria-hidden="true"></div>
  <a href="/" class="wordmark"><span class="wordmark-past">Past</span><span class="wordmark-port">Port</span></a>
  <div class="header-actions">
    <select id="language" aria-label="Interface language" data-zh-label="界面语言" data-en-label="Interface language">
      <option value="en" selected>English</option>
      <option value="zh">简体中文</option>
      <option value="tr">Türkçe</option>
    </select>
    <button id="passport" data-zh="我的通关文书" data-en="My Passport">My Passport</button>
  </div>
</header>
<main>
<section id="home" class="home">
  <div class="spatial-stage">
    <svg class="passport-art" viewBox="0 0 580 390" role="img" aria-label="A nostalgic passport and travel stamp" data-zh-label="护照与印章" data-en-label="A passport and travel stamp">
      <defs>
        <radialGradient id="ambient-glow" cx="50%" cy="46%" r="54%">
          <stop offset="0%" stop-color="#f8d993" stop-opacity="0.38"/>
          <stop offset="50%" stop-color="#cf9442" stop-opacity="0.14"/>
          <stop offset="100%" stop-color="#1c0912" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="celestial-halo" cx="50%" cy="40%" r="58%">
          <stop offset="0%" stop-color="#ffd980" stop-opacity="0.22"/>
          <stop offset="60%" stop-color="#994d22" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#15060e" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="leather-cover" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4a1122"/>
          <stop offset="35%" stop-color="#722138"/>
          <stop offset="70%" stop-color="#551425"/>
          <stop offset="100%" stop-color="#320814"/>
        </linearGradient>
        <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="80%">
          <stop offset="0%" stop-color="#fdf3cf"/>
          <stop offset="25%" stop-color="#ecc779"/>
          <stop offset="50%" stop-color="#cda350"/>
          <stop offset="75%" stop-color="#f7df9b"/>
          <stop offset="100%" stop-color="#aa7c2c"/>
        </linearGradient>
        <linearGradient id="pages-edge" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f6ebd2"/>
          <stop offset="50%" stop-color="#dec08f"/>
          <stop offset="100%" stop-color="#b8935c"/>
        </linearGradient>
        <linearGradient id="boarding-slip" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#faf2de"/>
          <stop offset="50%" stop-color="#ebd8b1"/>
          <stop offset="100%" stop-color="#d9bd8d"/>
        </linearGradient>
        <radialGradient id="wax-body" cx="35%" cy="32%" r="68%">
          <stop offset="0%" stop-color="#d44038"/>
          <stop offset="45%" stop-color="#982525"/>
          <stop offset="85%" stop-color="#641014"/>
          <stop offset="100%" stop-color="#3c0609"/>
        </radialGradient>
        <linearGradient id="brass-rim" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fae39d"/>
          <stop offset="35%" stop-color="#c99849"/>
          <stop offset="70%" stop-color="#7e5420"/>
          <stop offset="100%" stop-color="#42290d"/>
        </linearGradient>
        <radialGradient id="compass-glass" cx="40%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
          <stop offset="50%" stop-color="#fbf4dd" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#554425" stop-opacity="0.4"/>
        </radialGradient>
        <filter id="shadow-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
        </filter>
        <filter id="antique-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#040103" flood-opacity="0.82"/>
          <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#140409" flood-opacity="0.5"/>
        </filter>
        <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- Layer 0: Infinite Distance - Atmospheric Ambient & Celestial Halo -->
      <circle cx="290" cy="190" r="230" fill="url(#ambient-glow)"/>
      <circle cx="290" cy="180" r="185" fill="url(#celestial-halo)"/>

      <!-- Layer 1: Mid Distance - Ancient Nautical Chart & Navigation Graticule -->
      <g class="chart-backdrop" opacity="0.34" stroke="#dcb46a" stroke-width="1" fill="none">
        <circle cx="290" cy="185" r="175" stroke-dasharray="2 5"/>
        <circle cx="290" cy="185" r="120" stroke-dasharray="1 6"/>
        <line x1="30" y1="185" x2="550" y2="185" stroke-dasharray="3 7"/>
        <line x1="290" y1="10" x2="290" y2="360" stroke-dasharray="3 7"/>
        <path d="M80 50 L290 185 L500 320 M80 320 L290 185 L500 50" stroke-dasharray="4 8" stroke-width="0.8"/>
      </g>

      <!-- Faded Overland Silk Route Trail -->
      <path class="route-trail" d="M40 330 C120 280 180 290 270 240 S390 195 520 100" fill="none" stroke="#e8ba6c" stroke-width="2" stroke-dasharray="4 7" opacity="0.5"/>

      <!-- Dynamic Optical Drop Shadow Beneath Floating Passport (Eye-Trick of Suspension) -->
      <ellipse id="passport-shadow" cx="260" cy="335" rx="145" ry="24" fill="#030102" filter="url(#shadow-blur)"/>

      <!-- Layer 2: Focal Distance - Antique Boarding Permit (Protruding Behind Journal) -->
      <g class="permit-slip" transform="rotate(-15 230 145)" filter="url(#antique-shadow)">
        <rect x="125" y="30" width="170" height="220" rx="4" fill="url(#boarding-slip)" stroke="#9c7849" stroke-width="1.2"/>
        <rect x="131" y="36" width="158" height="208" rx="2" fill="none" stroke="#bda072" stroke-dasharray="2 3"/>
        <line x1="131" y1="62" x2="289" y2="62" stroke="#9c7849" stroke-width="1"/>
        <text x="210" y="52" text-anchor="middle" fill="#693b22" font-family="Georgia,serif" font-size="8.5" font-weight="bold" letter-spacing="2">PASSAGE PERMIT</text>
        <text x="142" y="77" fill="#805634" font-family="Georgia,serif" font-size="7">ORIGIN: PRESENT</text>
        <text x="142" y="89" fill="#805634" font-family="Georgia,serif" font-size="7">DEST: BURSA · 1326</text>
        <text x="142" y="101" fill="#805634" font-family="Georgia,serif" font-size="7">BERTH: OSMANGAZİ</text>
        <g fill="#7e5330" opacity="0.65">
          <rect x="142" y="112" width="2" height="18"/><rect x="146" y="112" width="4" height="18"/>
          <rect x="152" y="112" width="1" height="18"/><rect x="155" y="112" width="3" height="18"/>
          <rect x="160" y="112" width="5" height="18"/><rect x="167" y="112" width="2" height="18"/>
          <rect x="171" y="112" width="3" height="18"/>
        </g>
        <text x="210" y="125" text-anchor="middle" fill="#9f3a33" font-family="Georgia,serif" font-size="10" font-weight="bold" letter-spacing="1" opacity="0.85">№ 1326-B</text>
        <circle cx="275" cy="46" r="4" fill="#240c15"/>
      </g>

      <!-- The Main Floating Travel Journal / PastPort (Focal 3D Levitation Artifact) -->
      <g class="cover-float" filter="url(#antique-shadow)">
        <g transform="rotate(-7 255 190)">
          <!-- Page Layers Depth / Edge Gilding -->
          <rect x="148" y="56" width="196" height="260" rx="12" fill="url(#pages-edge)"/>
          <path d="M342 62 L346 66 L346 312 L342 308 Z" fill="#9c7847"/>
          <path d="M156 312 L160 316 L346 316 L342 312 Z" fill="#7d5d34"/>

          <!-- Rich Leather Binding -->
          <rect x="140" y="50" width="200" height="260" rx="11" fill="url(#leather-cover)" stroke="#d9b165" stroke-width="2"/>
          <!-- Spine Shadow & Binding Crease -->
          <rect x="140" y="50" width="16" height="260" rx="11" fill="#260811" opacity="0.45"/>
          <line x1="156" y1="50" x2="156" y2="308" stroke="#1c050c" stroke-width="1.8"/>

          <!-- Decorative Gold-Foil Border -->
          <rect x="162" y="66" width="164" height="228" rx="6" fill="none" stroke="url(#gold-leaf)" stroke-width="1.6"/>
          <rect x="166" y="70" width="156" height="220" rx="4" fill="none" stroke="#7e5927" stroke-width="0.8" stroke-dasharray="3 2"/>

          <!-- Filigree Corner Brackets -->
          <g fill="url(#gold-leaf)">
            <path d="M164 68 q12 2 14 14 q-2 -12 -14 -14z"/>
            <path d="M324 68 q-12 2 -14 14 q2 -12 14 -14z"/>
            <path d="M164 292 q12 -2 14 -14 q-2 12 -14 14z"/>
            <path d="M324 292 q-12 -2 -14 -14 q2 12 14 14z"/>
          </g>

          <!-- Top Heading -->
          <text x="248" y="102" text-anchor="middle" fill="url(#gold-leaf)" font-family="Georgia,serif" font-size="16" font-weight="bold" letter-spacing="4">TÜRKİYE</text>

          <!-- Canonical Turkish Crescent & Star National Emblem (Türk Bayrağı Ay-Yıldız) -->
          <g transform="translate(248 166) scale(0.18)">
            <!-- Embossed Inset Shadow -->
            <g transform="translate(-351.6 -298)" fill="#18040b" opacity="0.55">
              <path d="M 426.754 219.785 A 150 150 0 1 0 426.754 380.215 A 120 120 0 1 1 426.754 219.785 Z"/>
              <polygon points="417.504,300 469.328,283.161 469.328,228.671 501.357,272.755 553.18,255.916 521.151,300 553.18,344.084 501.357,327.245 469.328,371.329 469.328,316.839"/>
            </g>
            <!-- Gold Leaf Foil Emblem -->
            <g transform="translate(-351.6 -300)" fill="url(#gold-leaf)">
              <path d="M 426.754 219.785 A 150 150 0 1 0 426.754 380.215 A 120 120 0 1 1 426.754 219.785 Z"/>
              <polygon points="417.504,300 469.328,283.161 469.328,228.671 501.357,272.755 553.18,255.916 521.151,300 553.18,344.084 501.357,327.245 469.328,371.329 469.328,316.839"/>
            </g>
          </g>

          <!-- Embossed "PASTPORT" Title on Folio Cover -->
          <text x="248" y="237.2" text-anchor="middle" fill="#18040b" font-family="'Cormorant Garamond',Georgia,serif" font-size="14" font-weight="bold" letter-spacing="4.5" opacity="0.6">PASTPORT</text>
          <text x="248" y="236" text-anchor="middle" fill="url(#gold-leaf)" font-family="'Cormorant Garamond',Georgia,serif" font-size="14" font-weight="bold" letter-spacing="4.5">PASTPORT</text>
          <line x1="216" y1="244" x2="280" y2="244" stroke="url(#gold-leaf)" stroke-width="1" opacity="0.75"/>
        </g>
      </g>

      <!-- Antique Brass Pocket Stopwatch (Floating Upper Left, No Shadow) -->
      <g transform="translate(36 125)">
        <g class="stopwatch-float">
          <!-- Top Crown & Bow Ring -->
          <path d="M30 11 A7 7 0 0 1 42 11" fill="none" stroke="url(#brass-rim)" stroke-width="1.8"/>
          <rect x="33" y="6" width="6" height="5" rx="1.2" fill="url(#brass-rim)" stroke="#3f270e" stroke-width="0.7"/>
          <rect x="18" y="14" width="4" height="4" rx="1" transform="rotate(-30 20 16)" fill="url(#brass-rim)" stroke="#3f270e" stroke-width="0.6"/>
          <!-- Stopwatch Body -->
          <circle cx="36" cy="44" r="32" fill="url(#brass-rim)" stroke="#3f270e" stroke-width="2"/>
          <circle cx="36" cy="44" r="28" fill="#2e1d0d" stroke="#fae39d" stroke-width="0.8"/>
          <circle cx="36" cy="44" r="25" fill="#fcf6e6"/>
          <!-- Chronograph Second Track & Numbers -->
          <circle cx="36" cy="44" r="22" fill="none" stroke="#7e5a2b" stroke-width="0.5" stroke-dasharray="1 2"/>
          <text x="36" y="27" text-anchor="middle" fill="#8f2c25" font-family="Georgia,serif" font-size="5" font-weight="bold">60</text>
          <text x="53" y="46" text-anchor="middle" fill="#583f1d" font-family="Georgia,serif" font-size="4.5">15</text>
          <text x="36" y="64" text-anchor="middle" fill="#583f1d" font-family="Georgia,serif" font-size="4.5">30</text>
          <text x="19" y="46" text-anchor="middle" fill="#583f1d" font-family="Georgia,serif" font-size="4.5">45</text>
          <!-- Sub-Dial (Chronograph Register) -->
          <g stroke="#916c37" stroke-width="0.5" opacity="0.8">
            <circle cx="36" cy="35" r="5.5" fill="none" stroke-dasharray="1 1"/>
            <line x1="36" y1="35" x2="38.5" y2="33" stroke="#233b47" stroke-width="0.7" stroke-linecap="round"/>
            <circle cx="36" cy="35" r="0.8" fill="#233b47"/>
          </g>
          <!-- Blued Steel Stopwatch Needle Hand -->
          <g transform="rotate(72 36 44)">
            <line x1="36" y1="44" x2="36" y2="24" stroke="#1f3745" stroke-width="1" stroke-linecap="round"/>
            <circle cx="36" cy="48" r="1.3" fill="#1f3745"/>
            <circle cx="36" cy="44" r="2" fill="url(#brass-rim)" stroke="#3f270e" stroke-width="0.6"/>
          </g>
          <!-- Domed Crystal Glass Highlight -->
          <circle cx="36" cy="44" r="25" fill="url(#compass-glass)"/>
        </g>
      </g>

      <!-- Antique Brass Pocket Compass (Resting on Lower Left, No Shadow) -->
      <g transform="translate(64 250)">
        <g class="compass-float">
          <circle cx="44" cy="44" r="38" fill="url(#brass-rim)" stroke="#3f270e" stroke-width="2"/>
          <circle cx="44" cy="44" r="34" fill="#301f0e" stroke="#fae39d" stroke-width="1"/>
          <circle cx="44" cy="44" r="30" fill="#fcf6e6"/>
          <g stroke="#916c37" stroke-width="0.7" opacity="0.75">
            <line x1="44" y1="16" x2="44" y2="72"/>
            <line x1="16" y1="44" x2="72" y2="44"/>
            <circle cx="44" cy="44" r="22" fill="none" stroke-dasharray="1.5 2"/>
          </g>
          <text x="44" y="24" text-anchor="middle" fill="#9b2d28" font-family="Georgia,serif" font-size="7" font-weight="bold">N</text>
          <text x="44" y="70" text-anchor="middle" fill="#583f1d" font-family="Georgia,serif" font-size="6.5">S</text>
          <text x="68" y="46" text-anchor="middle" fill="#583f1d" font-family="Georgia,serif" font-size="6.5">E</text>
          <text x="20" y="46" text-anchor="middle" fill="#583f1d" font-family="Georgia,serif" font-size="6.5">W</text>
          <g transform="rotate(32 44 44)">
            <polygon points="44,20 48,44 44,41 40,44" fill="#ab2925" stroke="#681512" stroke-width="0.6"/>
            <polygon points="44,68 48,44 44,47 40,44" fill="#2d424b" stroke="#17242a" stroke-width="0.6"/>
            <circle cx="44" cy="44" r="3.5" fill="url(#brass-rim)" stroke="#3f270e" stroke-width="1"/>
          </g>
          <circle cx="44" cy="44" r="30" fill="url(#compass-glass)"/>
        </g>
      </g>

      <!-- Wax Seal with Ribbon (Bottom Right) -->
      <g class="seal-group" transform="translate(320 235)" filter="url(#antique-shadow)">
        <path d="M38 32 L46 95 L56 86 L66 94 L54 32 Z" fill="#78191f" stroke="#480c10" stroke-width="0.8"/>
        <path d="M48 32 L68 98 L78 90 L88 96 L64 32 Z" fill="#9a262d" stroke="#5a1116" stroke-width="0.8"/>
        <line x1="46" y1="94" x2="66" y2="93" stroke="#f0ce7f" stroke-width="1.8"/>
        <line x1="68" y1="97" x2="88" y2="95" stroke="#f0ce7f" stroke-width="1.8"/>
        <circle cx="48" cy="36" r="28" fill="url(#wax-body)" stroke="#490c0f" stroke-width="1.5"/>
        <circle cx="48" cy="36" r="23" fill="none" stroke="#e0726d" stroke-width="0.8" opacity="0.6"/>
        <g transform="translate(48 36)" stroke="#f59c98" stroke-width="1.3" fill="none" stroke-linecap="round">
          <path d="M-6 -10 h12 L6 -8 L-6 8 L6 10 h-12"/>
          <line x1="0" y1="-8" x2="0" y2="8"/>
          <path d="M-9 2 q9 10 18 0"/>
        </g>
      </g>

      <!-- Nostalgic Postal Cancellation Stamp (Floating Over Top Right) -->
      <g class="stamp-float">
        <g transform="rotate(13 425 145)" fill="none" stroke="#ad3e33" filter="url(#soft-glow)">
          <circle cx="425" cy="145" r="54" stroke-width="2.2" stroke-dasharray="180 0"/>
          <circle cx="425" cy="145" r="47" stroke-width="1" stroke-dasharray="3 3"/>
          <path id="stamp-path-top" d="M377 145 a48 48 0 0 1 96 0" fill="none"/>
          <path id="stamp-path-bottom" d="M473 145 a48 48 0 0 1 -96 0" fill="none"/>
          <text font-size="7.8" font-family="Georgia,serif" font-weight="bold" fill="#ad3e33" letter-spacing="1.8">
            <textPath href="#stamp-path-top" startOffset="50%" text-anchor="middle">PASTPORT · TRANSIT</textPath>
          </text>
          <text font-size="7.5" font-family="Georgia,serif" font-weight="bold" fill="#ad3e33" letter-spacing="2">
            <textPath href="#stamp-path-bottom" startOffset="50%" text-anchor="middle">★ BURSA 1326 ★</textPath>
          </text>
          <g transform="translate(425 145)" fill="#ad3e33" stroke="none">
            <path d="M-18 6 v-10 h36 v10 Z"/>
            <path d="M-14 -4 q7 -14 14 0 Z"/>
            <path d="M0 -4 q7 -14 14 0 Z"/>
            <rect x="-18" y="-14" width="2" height="10"/>
            <rect x="16" y="-14" width="2" height="10"/>
          </g>
          <text x="425" y="162" text-anchor="middle" fill="#993328" stroke="none" font-family="Georgia,serif" font-size="8.5" font-weight="bold" letter-spacing="1.5">OSMANGAZİ</text>
          <path d="M483 135 q14 -9 28 0 t28 0 M483 145 q14 -9 28 0 t28 0 M483 155 q14 -9 28 0 t28 0" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- Layer 4: Near Distance - Floating Stardust Memory Motes -->
      <g class="memory-motes" fill="#fadb8f">
        <circle class="mote mote-1" cx="260" cy="90" r="2" opacity="0.75"/>
        <circle class="mote mote-2" cx="380" cy="230" r="1.5" opacity="0.6"/>
        <circle class="mote mote-3" cx="180" cy="180" r="1.3" opacity="0.55"/>
        <circle class="mote mote-4" cx="320" cy="300" r="1.7" opacity="0.7"/>
        <circle class="mote mote-5" cx="460" cy="80" r="1.4" opacity="0.6"/>
      </g>
    </svg>
    <div class="spatial-caption">
      <p class="home-lead" data-zh="沿着旅路探索，每完成一段旅程，就为你的通关文书添一枚印章。" data-en="Follow the trail. Collect a stamp for every adventure you complete.">Follow the trail. Collect a stamp for every adventure you complete.</p>
      <div class="home-actions">
        <a class="primary-link" href="#map" data-zh="开启旅程" data-en="Starts Journey">Starts Journey <span class="action-arrow" aria-hidden="true">→</span></a>
        <a class="outline-link" href="#leaderboard" data-zh="排行榜" data-en="Leaderboard">Leaderboard</a>
      </div>
    </div>
  </div>
</section>

<!-- Leaderboard Section: Victorious Hall of Champions -->
<section id="leaderboard" class="board" hidden>
  <div class="board-top-bar">
    <a href="#" class="back-link" data-zh="← 返回" data-en="← Back">← Back</a>
  </div>
  <div class="board-header">
    <h1 data-zh="排行榜" data-en="Leaderboard">Leaderboard</h1>
    <p class="board-lead" data-zh="结识同行于漫漫旅途的旅人。" data-en="Meet other travelers on the same journey.">Meet other travelers on the same journey.</p>
  </div>
  <div id="rankings" aria-live="polite"></div>
</section>

<!-- Road Map Section: Bursa Osmangazi Silk Road Panorama -->
<div id="map" hidden>
  <div class="map-top-bar">
    <button type="button" id="map-back-btn" class="back-link" data-zh="← 返回" data-en="← Back">← Back</button>
  </div>

  <section class="intro intro-compact">
    <h1 data-zh="丝路 · 布尔萨" data-en="Silk Road · Bursa">Silk Road · Bursa</h1>
    <div class="panoramic-guide" aria-label="Panoramic journey scroll navigation">
      <span class="panoramic-hint" data-zh="↔ 水平滑动以探索横长丝绸之路画卷" data-en="↔ Scroll horizontally to explore the Silk Road trail">↔ Scroll horizontally to explore the Silk Road trail</span>
    </div>
  </section>
  <section class="atlas" aria-label="Osmangazi heritage sites and standalone games" data-zh-label="Osmangazi 遗址与独立试玩节点" data-en-label="Osmangazi heritage sites and standalone games">
    <div class="map-scroll" id="journey-scroll"><div class="map-sheet panoramic-sheet">
        <!-- Antique Topographical Cartography Background for Osmangazi Bursa Panorama -->
        <svg class="landscape" viewBox="0 0 2880 700" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="antique-vellum" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f8efe0"/>
              <stop offset="35%" stop-color="#f0dfc3"/>
              <stop offset="70%" stop-color="#e7cca6"/>
              <stop offset="100%" stop-color="#d9b689"/>
            </linearGradient>
            <radialGradient id="antique-vignette" cx="50%" cy="50%" r="65%">
              <stop offset="60%" stop-color="#70441e" stop-opacity="0"/>
              <stop offset="85%" stop-color="#5a3313" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#3c1e08" stop-opacity="0.28"/>
            </radialGradient>
            <linearGradient id="caravan-glow" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#e5b460" stop-opacity="0.2"/>
              <stop offset="50%" stop-color="#ffd782" stop-opacity="0.55"/>
              <stop offset="100%" stop-color="#d49335" stop-opacity="0.25"/>
            </linearGradient>
            <!-- Mountain Hatch Pattern -->
            <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="8" stroke="#754b2d" stroke-width="1.2" opacity="0.45"/>
            </pattern>
          </defs>

          <!-- Aged Vellum Paper Base & Vignette -->
          <rect width="2880" height="700" fill="url(#antique-vellum)"/>
