[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pastport-gameplay"
version = "0.1.0rc2"
description = "Deterministic gameplay preparation and presentation SDK"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12,<3.13"
dependencies = ["pastport==0.2.1rc4"]

[project.scripts]
pastport-gameplay = "pastport_gameplay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pastport_gameplay"]

[tool.ruff]
extend = "../../pyproject.toml"
include = ["src/**/*.py"]

[tool.uv.sources]
pastport = { workspace = true }
