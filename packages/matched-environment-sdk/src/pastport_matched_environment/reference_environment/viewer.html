* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #112b28;
  color: #f0f5e6;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button {
  font: inherit;
  cursor: pointer;
  min-height: 44px;
  border: 1px solid #ffffff30;
  color: #f0f5e6;
  background: #16352deb;
  border-radius: 8px;
  padding: 10px 16px;
}
button:focus-visible {
  outline: 3px solid #d8f3b5;
  outline-offset: 4px;
}
button[aria-current="true"],
button[aria-pressed="true"] {
  background: #d8e9c8;
  color: #20392b;
}
.tour-top {
  position: fixed;
  inset: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 78px 30px 24px;
  background: linear-gradient(#071a24b3, transparent);
  pointer-events: none;
}
.tour-top > * {
  pointer-events: auto;
}
.tour-top small {
  font-size: 9px;
  letter-spacing: 3px;
  color: #dce7cf;
}
.tour-top h1 {
  font-size: 22px;
  margin: 5px 0;
  font-weight: 500;
}
.tour-top > button {
  margin-left: auto;
}
.wordmark {
  font-size: 44px;
  font-family: Georgia, serif;
  position: relative;
}
.brand-dot {
  font-size: 12px;
  color: #c7e2a1;
}
#tour-view {
  position: fixed;
  inset: 0;
}
#tour-scenes {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  max-width: 90%;
  overflow: auto;
  padding: 5px;
}
#tour-scenes button {
  white-space: nowrap;
  font-size: 12px;
}
.tour-controls {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  white-space: nowrap;
}
.tour-controls button {
  font-size: 12px;
}
#tour-notice {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 10px;
  background: #10221c88;
  margin: 0;
  padding: 5px;
  pointer-events: none;
}
.pnlm-about-msg {
  display: none !important;
}
dialog {
  color: #193a2c;
  background: #f7f9f0;
  border: 0;
  border-radius: 12px;
  max-width: min(500px, 90vw);
  padding: 25px;
}
dialog::backdrop {
  background: #0b2829aa;
}
dialog p {
  white-space: pre-wrap;
  line-height: 1.8;
}
dialog button {
  color: #f0f5e6;
}
.xr-canvas {
  position: fixed;
  inset: 0;
  z-index: 9999;
}
@media (max-width: 600px) {
  .tour-top {
    padding: 20px;
  }
  .tour-top h1 {
    font-size: 17px;
  }
  .tour-top > button {
    padding: 8px;
    min-width: 42px;
  }
  .tour-top button span {
    display: none;
  }
  .tour-controls button {
    padding: 9px;
    font-size: 10px;
  }
  .tour-top small {
    font-size: 7px;
    letter-spacing: 2px;
  }
}
.minimap{position:absolute;top:calc(88px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:220px;z-index:5;font:12px system-ui,sans-serif;color:#fff}
.minimap-toggle{min-width:44px;min-height:44px;float:right;background:rgba(20,24,32,.85);color:#fff;border:1px solid #fff4;border-radius:8px}
.minimap-body{clear:both;background:rgba(20,24,32,.85);border:1px solid #fff4;border-radius:8px;padding:6px}
.minimap-body svg{width:100%;height:auto;display:block}
.minimap-edge{fill:none;stroke:#9fb4d0;stroke-width:2}
.minimap-edge.unverified{stroke:#e0a040}
.minimap-edge.on-path{stroke:#6fe3a0;stroke-width:3}
.minimap-wedge{fill:#6fe3a066;stroke:#6fe3a0}
.minimap-node{cursor:pointer;fill:#fff;outline:none}
.minimap-node .hit{fill:transparent}
.minimap-node.current circle:not(.hit){fill:#6fe3a0}
.minimap-node:focus-visible .hit{stroke:#fff;stroke-width:2}
.minimap-node text{font-size:9px;text-anchor:middle;fill:#fff}
.minimap-floors{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.minimap button{min-height:44px;min-width:44px;background:#243;color:#fff;border:1px solid #fff4;border-radius:6px;padding:0 8px}
.minimap button[aria-pressed="true"]{background:#2d6a4f}
.minimap-status{margin:4px 0 0;min-height:1em}
@media (max-width:480px){.minimap{width:170px}}

.pnlm-hotspot-base.trial-number{width:28px;height:28px;border:1px solid #fff;border-radius:50%;background:transparent!important;background-image:none!important;box-shadow:none;text-shadow:0 1px 3px #000,0 -1px 3px #000;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font:bold 15px system-ui}
.pnlm-hotspot-base.trial-number:before{content:attr(data-object-number)}
.pnlm-hotspot-base.trial-number:focus-visible{outline:3px solid #ffd05b;outline-offset:3px}
.trial-number>span{display:none!important}
#info{width:min(650px,85vw);max-height:80vh;overflow:auto;border-radius:12px}
#info p{white-space:pre-wrap;line-height:1.65;text-align:left}
#position-editor{position:fixed;top:150px;left:12px;z-index:11000;max-width:90vw;background:#163d35ed;color:#fff;padding:8px;border-radius:8px;font:12px system-ui}
#position-editor button{cursor:pointer;padding:6px;margin-right:6px}
.position-editing .trial-number{cursor:move;touch-action:none;border-color:#ffd05b}
.position-unsaved{border-style:dashed!important;border-color:#ffab45!important}
#trial-summary{position:fixed;left:12px;bottom:80px;z-index:10000;max-width:min(440px,80vw);padding:8px 12px;background:#163d35e8;color:white;border-radius:8px;font:12px system-ui;pointer-events:none}
